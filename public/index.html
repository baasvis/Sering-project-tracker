<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Sering — Projects</title>
  <link rel="preload" href="/fonts/OverusedGroteskRoman-VF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/projects.css">
  <link rel="stylesheet" href="/css/comments.css">
  <link rel="stylesheet" href="/css/media.css">
  <link rel="stylesheet" href="/css/shopping.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <!-- Quill rich text editor (SRI-protected) -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet"
        integrity="sha384-ecIckRi4QlKYya/FQUbBUjS4qp65jF/J87Guw5uzTbO1C1Jfa/6kYmd6dXUF6D7i" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"
          integrity="sha384-utBUCeG4SYaCm4m7GQZYr8Hy8Fpy3V4KGjBZaf4WTKOcwhCYpt/0PfeEe3HNlwx8" crossorigin="anonymous" defer></script>
  <!-- Google Sign-In SDK (no SRI — Google rotates this script) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Screenshot capture for problem reports (SRI-protected) -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
          integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous" defer></script>
</head>
<body>
  <!-- Name entry overlay (for non-admin visitors) -->
  <div id="name-overlay" class="overlay" style="display:none">
    <div class="overlay-card">
      <h1>Welcome to De Sering Projects</h1>
      <p>Enter your name to join the conversation.</p>
      <p class="overlay-warning">Everything on this platform is public</p>
      <label for="name-input" class="sr-only">Your name</label>
      <input type="text" id="name-input" placeholder="Your name" maxlength="50" autofocus>
      <button id="name-submit" class="btn btn-primary">Let's go</button>
    </div>
  </div>

  <!-- Top navigation bar -->
  <header id="top-nav">
    <div class="nav-inner">
      <a href="#" class="nav-logo" data-screen="dashboard">De Sering</a>
      <nav id="nav-links"></nav>
      <div id="nav-right">
        <span id="user-name"></span>
        <button id="admin-login-btn" class="btn btn-small" style="display:none">Admin</button>
        <button id="admin-logout-btn" class="btn btn-small" style="display:none">Logout</button>
      </div>
    </div>
  </header>

  <!-- Main content area -->
  <main id="app">
    <noscript>
      <div style="text-align:center;padding:40px 20px;">
        <h1>JavaScript Required</h1>
        <p>De Sering Projects needs JavaScript to work. Please enable it in your browser settings.</p>
      </div>
    </noscript>
  </main>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <!-- Scripts (order matters) -->
  <script src="/js/state.js"></script>
  <script src="/js/events.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/media.js"></script>
  <script src="/js/comments.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/projects.js"></script>
  <script src="/js/shopping.js"></script>
  <script src="/js/budget.js"></script>
  <script src="/js/reports.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/sse.js"></script>
  <script src="/js/init.js"></script>
</body>
</html>
