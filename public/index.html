<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Sering — Projects</title>
  <link rel="preload" href="/fonts/OverusedGroteskRoman-VF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/projects.css">
  <link rel="stylesheet" href="/css/comments.css">
  <link rel="stylesheet" href="/css/media.css">
  <link rel="stylesheet" href="/css/shopping.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <!-- Quill rich text editor -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <!-- Google Sign-In SDK for admin login -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Screenshot capture for problem reports -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <!-- Name entry overlay (for non-admin visitors) -->
  <div id="name-overlay" class="overlay" style="display:none">
    <div class="overlay-card">
      <h1>Welcome to De Sering Projects</h1>
      <p>Enter your name to join the conversation.</p>
      <p class="overlay-warning">Everything on this platform is public</p>
      <input type="text" id="name-input" placeholder="Your name" maxlength="50" autofocus>
      <button id="name-submit" class="btn btn-primary">Let's go</button>
    </div>
  </div>

  <!-- Top navigation bar -->
  <header id="top-nav">
    <div class="nav-inner">
      <a href="#" class="nav-logo" data-screen="dashboard">De Sering</a>
      <nav id="nav-links"></nav>
      <div id="nav-right">
        <span id="user-name"></span>
        <button id="admin-login-btn" class="btn btn-small" style="display:none">Admin</button>
        <button id="admin-logout-btn" class="btn btn-small" style="display:none">Logout</button>
      </div>
    </div>
  </header>

  <!-- Main content area -->
  <main id="app"></main>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <!-- Scripts (order matters) -->
  <script src="/js/state.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/media.js"></script>
  <script src="/js/comments.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/projects.js"></script>
  <script src="/js/shopping.js"></script>
  <script src="/js/budget.js"></script>
  <script src="/js/reports.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/init.js"></script>
</body>
</html>
